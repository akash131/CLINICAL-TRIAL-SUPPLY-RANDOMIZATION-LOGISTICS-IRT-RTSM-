apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: irt-rtsm
data:
  NODE_ENV: "production"
  PORT: "3000"
  API_VERSION: "v1"
  LOG_LEVEL: "info"

---
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: irt-rtsm
type: Opaque
data:
  DATABASE_URL: cG9zdGdyZXNxbDovL2lydF9hZG1pbjpzZWN1cmVfcGFzc3dvcmRAcG9zdGdyZXM6NTQzMi9pcnRfcnRzbV9kYg== # base64
  JWT_SECRET: Y2hhbmdlX3RoaXNfc2VjcmV0X2luX3Byb2R1Y3Rpb24= # base64
  REDIS_URL: cmVkaXM6Ly9yZWRpCzo2Mzc5 # base64

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: irt-rtsm
  labels:
    app: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        image: irt-rtsm-backend:latest
        ports:
        - containerPort: 3000
          name: http
        envFrom:
        - configMapRef:
            name: backend-config
        - secretRef:
            name: backend-secret
        resources:
          requests:
            memory: "512Mi"
            cpu: "500m"
          limits:
            memory: "1Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5

---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: irt-rtsm
  labels:
    app: backend
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: backend

---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend-hpa
  namespace: irt-rtsm
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
